<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b24"><meta name="description" content="Slice flying bananas, avoid bombs, and beat your high score in Pami Kany."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Pami Kany — Banana Slice</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10241e;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:12px 14px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #0009}#hud div{background:#071b16a9;padding:8px 12px;border-radius:12px}#panel{position:fixed;inset:0;display:grid;place-items:center;background:#061510ba}#card{width:min(90vw,380px);padding:30px 22px;text-align:center;border-radius:24px;background:#173d2e;border:2px solid #f5c84d;box-shadow:0 15px 60px #0009}h1{font-size:42px;margin:0;color:#ffdd65}p{line-height:1.5}button{border:0;border-radius:14px;background:#ffd24b;color:#253323;font-size:19px;font-weight:900;padding:13px 34px;cursor:pointer}small{color:#d5e8d8}#mute{position:fixed;bottom:14px;right:14px;background:#173d2edb;color:white;border:1px solid #6d987b;padding:9px 12px;font-size:14px}</style></head><body><canvas id="game" aria-label="Banana slicing arcade game"></canvas><div id="hud"><div>🍌 SCORE <span id="score">0</span><br><small>BEST <span id="best">0</span></small></div><div>❤️ <span id="lives">3</span><br><small>⏱ <span id="time">60</span>s</small></div></div><section id="panel"><div id="card"><h1>🍌 Pami Kany</h1><h2>Banana Slice</h2><p>Swipe across flying bananas to slice them!<br>Avoid bombs 💣 and don't miss too many bananas.</p><p><small>60 seconds · 3 lives · Mouse or touch</small></p><button id="start">PLAY NOW</button><p id="result"></p></div></section><button id="mute" aria-label="Toggle sound">🔊 Sound</button><script src="game.js"></script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
